[project]
name = "orcad2kicad"
version = "0.1.0"
description = "Convert OrCAD Capture .DSN schematics to KiCad format"
requires-python = ">=3.9"
dependencies = ["olefile>=0.46"]
readme = "README.md"

[project.optional-dependencies]
# Runtime needs only olefile (pure Python). freetype-py + fonttools are
# dev-only — used by scripts/gen_text_metrics.py to regenerate the embedded
# font tables (text_metrics_data.py). They are NOT required to run the
# converter, which uses the precomputed tables.
dev = ["pytest>=7", "olefile>=0.46", "freetype-py", "fonttools"]
